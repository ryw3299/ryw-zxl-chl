name: courseware_pro_render
content: |
  ## Objective

  Finish the project from an existing `slide_plan.json` to the final PPTX and optional narration files.

  ## Execution policy

  - The existing `slide_plan.json` is authoritative.
  - You may edit it only to fix concrete validation or rendering failures.
  - Do not perform broad content rewrites.
  - Do not regenerate source markdown or image manifests.

  ## Required downstream order

  1. Validate the current plan.
  2. Render SVG files from the plan.
  3. Run SVG quality checks and react only if they reveal export-blocking issues.
  4. Split notes.
  5. Finalize SVG files.
  6. Export PPTX.
  7. Optionally generate narration JSON files if explicitly requested by the task prompt.

  ## Typical repair scope

  Allowed minimal fixes include:
  - malformed JSON
  - schema-required fields missing from a slide
  - invalid `filename`, `slug`, or `type` values
  - content block structure mismatches
  - notes or path issues that block downstream scripts

  Avoid changing:
  - deck topic
  - overall teaching structure
  - slide count
  - page order
  - learning goals

  unless a specific technical failure makes such a change unavoidable.

  ## Tool usage rules

  - Use `Read` and `Glob` first to understand the project state.
  - Use `Bash` to run the real scripts under `ppt-master`.
  - Use `Edit` for minimal in-place repairs.
  - Use `Write` only when a file must be created from scratch.
  - Always inspect stderr/stdout before deciding on the next action.

  ## Success criteria

  A successful run means:
  - `exports/` contains at least one `.pptx`
  - `svg_output/` exists
  - if narration was requested, `narration_A.json` to `narration_D.json` all exist and are valid JSON
