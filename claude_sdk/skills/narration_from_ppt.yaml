content: |
  ## 讲稿生成规范

  ### 讲稿风格
  - **口语化**：用日常教学语言，避免书面语和学术腔。例如用"大家注意看"而不是"值得注意的是"。
  - **自然过渡**：页与页之间要有逻辑衔接，不要突兀跳转。例如"了解了基本概念，接下来我们看一个具体的例子..."
  - **补充解释**：PPT 上只有关键词，讲稿要把背后的原理和故事讲出来。
  - **情感投入**：适当表达热情和强调，如"这一点非常重要！""大家一定要记住..."

  ### 节奏控制
  | 页面类型 | 建议时长 | 讲稿风格 |
  |---------|---------|---------|
  | 封面/目录 | 30-60秒 | 简短有力，点明主题 |
  | 章节过渡 | 30-60秒 | 承上启下，预告重点 |
  | 概念讲解 | 2-3分钟 | 深入浅出，举例说明 |
  | 公式推导 | 2-3分钟 | 逐步引导，强调逻辑 |
  | 对比分析 | 1-2分钟 | 并列展开，突出差异 |
  | 课堂互动 | 1-2分钟 | 引导思考，鼓励回答 |
  | 课程总结 | 1-2分钟 | 回顾要点，布置作业 |

  ### script 结构模板（每页）
  1. **开场白**（1-2句）：引入本页主题，可回顾上页或提出问题
  2. **核心内容**（3-5句）：展开讲解 PPT 上的要点，补充背景、原理、例子
  3. **强调/互动**（1-2句）：突出重点或引导思考
  4. **过渡语**（1句）：自然过渡到下一页

  ### 禁忌
  - ❌ 不要逐字念 PPT 上的文字
  - ❌ 不要出现"如图所示""大家看PPT"等元评论（讲稿本身就是"说"的内容）
  - ❌ 不要过度堆砌术语而不解释
  - ❌ 不要一页讲稿超过 500 字（学生注意力有限）

  ### 优秀示例

  **PPT 内容**：
  - 强度：构件抵抗破坏的能力
  - 刚度：构件抵抗变形的能力
  - 稳定性：构件保持原有平衡形式的能力

  **讲稿示例**：
  "好，我们来看构件要安全工作，必须满足三个基本要求。第一个叫强度。强度是什么呢？就是构件抵抗破坏的能力。打个比方，一根绳子能吊多重的东西不断，这就是它的强度。如果构件强度不够，就会断裂或者发生显著的塑性变形，那整个结构就危险了。"
  "第二个是刚度。刚度讲的是抵抗变形的能力。大家想象一下，一座桥如果车开上去就往下弯得很厉害，虽然没断，但是谁敢走呢？所以刚度要求构件在受力后的变形不能太大，要在允许的范围之内。"
  "第三个是稳定性。这个有点抽象。稳定性说的是构件保持原有平衡形式的能力。我给大家举个经典的例子——压杆。一根细长的杆受压时，它可能不是被压断，而是突然变弯了，这种现象叫失稳。失稳也是工程上必须防止的失效形式。"
  "这三个要求——强度、刚度、稳定性——是材料力学研究的核心理由，后面几章我们会逐一深入讲解。"
