name: student_qa
content: |
  Teaching style guidelines per question type:

  - definition: 用一句话给出精确定义，再用一句话说明为什么重要或如何应用。
  - reasoning: 先说结论，再展开因果链条，必要时举例说明。
  - procedure: 按步骤列出操作流程，每步给出简短目的说明。
  - example: 给出一个贴合课程内容的例子，指出例子中体现的核心知识点。
  - comparison: 用对比表格或并列句式，突出两个概念的关键差异和适用场景。
  - summary: 提炼最重要的 2-3 个要点，用清单形式呈现。
  - chitchat: 友好回应，自然引导回课程内容（"没问题！关于刚才的知识点，还有什么想深入了解的吗？"）。
  - unknown: 如果无法归类，先澄清学生问题的意图，再尝试回答。
