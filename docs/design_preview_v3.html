<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超星互动智课 - 备课台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #3370ff;
            --primary-strong: #245bdb;
            --bg: #f5f6f8;
            --surface: #ffffff;
            --border: #dfe1e6;
            --text-main: #1d2129;
            --text-muted: #6b7785;
            --success: #34c759;
            --warning: #ff9500;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: border-color 0.2s ease;
        }
        
        .card:hover {
            border-color: #c0c6d4;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-strong);
        }

        .nav-link {
            position: relative;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--text-main);
        }
        .nav-link.active {
            color: var(--primary);
            font-weight: 500;
        }
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -18px; /* match header h-14 padding context */
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--primary);
            border-radius: 2px 2px 0 0;
        }
        
        .course-list-item {
            border-bottom: 1px solid var(--border);
        }
        .course-list-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-[#dfe1e6] sticky top-0 z-10">
        <div class="max-w-[1100px] mx-auto px-6 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-10">
                <div class="flex items-center space-x-2 text-[#3370ff]">
                    <!-- Clean SVG Logo -->
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"></path>
                    </svg>
                    <span class="text-[16px] font-semibold tracking-tight text-[#1d2129]">互动智课</span>
                </div>
                <nav class="hidden md:flex space-x-8 text-[14px]">
                    <a href="#" class="nav-link active">备课工作台</a>
                    <a href="#" class="nav-link">我的资源库</a>
                    <a href="#" class="nav-link">学情分析</a>
                </nav>
            </div>
            <div class="flex items-center space-x-5">
                <div class="relative">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-[#a0a8b4]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="搜索课件..." class="bg-[#f5f6f8] border border-transparent focus:border-[#3370ff] focus:bg-white rounded pl-9 pr-3 py-1.5 text-[13px] outline-none transition-colors w-48 placeholder-[#a0a8b4]">
                </div>
                <button class="text-[#6b7785] hover:text-[#1d2129] transition-colors relative">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <div class="w-7 h-7 rounded-full bg-[#3370ff] text-white flex items-center justify-center text-[12px] font-medium cursor-pointer">
                    王
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-[1100px] mx-auto w-full px-6 py-10">
        <!-- Text intro, no banner -->
        <div class="mb-8">
            <h1 class="text-[24px] font-semibold text-[#1d2129] leading-tight mb-2">上午好，王老师</h1>
            <p class="text-[#6b7785] text-[14px]">今天想从哪里开始？你最近正在制作《高中物理：牛顿第二定律》。</p>
        </div>

        <div class="flex gap-6">
            <!-- Main Content Area: Document List -->
            <div class="flex-1">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-[15px] font-semibold text-[#1d2129]">最近的课件</h2>
                    <button class="text-[13px] text-[#3370ff] hover:text-[#245bdb] font-medium">查看全部</button>
                </div>

                <div class="card bg-white">
                    <!-- Item 1 -->
                    <div class="course-list-item px-5 py-4 flex items-center group cursor-pointer hover:bg-[#fafafa] transition-colors">
                        <div class="w-10 h-10 rounded bg-[#f5f6f8] text-[#3370ff] flex items-center justify-center mr-4 group-hover:bg-[#ebf0ff] transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14px] font-medium text-[#1d2129] mb-1 group-hover:text-[#3370ff] transition-colors">高中物理：牛顿第二定律解析</h3>
                            <div class="flex items-center text-[12px] text-[#6b7785] space-x-3">
                                <span>昨天 15:30</span>
                                <span>·</span>
                                <span>24页内容</span>
                                <span>·</span>
                                <span class="text-[#ff9500] flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-[#ff9500] mr-1.5"></span>AI语音合成中</span>
                            </div>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="px-3 py-1.5 border border-[#dfe1e6] rounded text-[13px] text-[#1d2129] bg-white hover:border-[#3370ff] hover:text-[#3370ff] transition-colors">继续编辑</button>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="course-list-item px-5 py-4 flex items-center group cursor-pointer hover:bg-[#fafafa] transition-colors">
                        <div class="w-10 h-10 rounded bg-[#f5f6f8] text-[#6b7785] flex items-center justify-center mr-4 group-hover:bg-[#f0f2f5] transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14px] font-medium text-[#1d2129] mb-1 group-hover:text-[#3370ff] transition-colors">《红楼梦》人物关系与时代背景</h3>
                            <div class="flex items-center text-[12px] text-[#6b7785] space-x-3">
                                <span>3天前</span>
                                <span>·</span>
                                <span>包含互动问答</span>
                                <span>·</span>
                                <span class="text-[#34c759] flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-[#34c759] mr-1.5"></span>已发布</span>
                            </div>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="px-3 py-1.5 border border-[#dfe1e6] rounded text-[13px] text-[#1d2129] bg-white hover:border-[#3370ff] hover:text-[#3370ff] transition-colors">查看</button>
                        </div>
                    </div>

                    <!-- Item 3 -->
                    <div class="course-list-item px-5 py-4 flex items-center group cursor-pointer hover:bg-[#fafafa] transition-colors">
                        <div class="w-10 h-10 rounded bg-[#f5f6f8] text-[#6b7785] flex items-center justify-center mr-4 group-hover:bg-[#f0f2f5] transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-[14px] font-medium text-[#1d2129] mb-1 group-hover:text-[#3370ff] transition-colors">英语口语听力实战：日常点餐</h3>
                            <div class="flex items-center text-[12px] text-[#6b7785] space-x-3">
                                <span>上周</span>
                                <span>·</span>
                                <span>视频与录音</span>
                                <span>·</span>
                                <span class="text-[#34c759] flex items-center"><span class="w-1.5 h-1.5 rounded-full bg-[#34c759] mr-1.5"></span>已发布</span>
                            </div>
                        </div>
                        <div class="opacity-0 group-hover:opacity-100 transition-opacity">
                            <button class="px-3 py-1.5 border border-[#dfe1e6] rounded text-[13px] text-[#1d2129] bg-white hover:border-[#3370ff] hover:text-[#3370ff] transition-colors">查看</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Sidebar: Quick Actions & Brief Stats -->
            <div class="w-64 space-y-5">
                <button class="w-full btn-primary h-9 flex items-center justify-center space-x-2 font-medium text-[13px]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>新建智能课件</span>
                </button>
                
                <div class="card p-1">
                    <button class="w-full flex items-center px-3 py-2.5 hover:bg-[#f5f6f8] rounded transition-colors group">
                        <div class="text-[#a0a8b4] mr-2.5 group-hover:text-[#3370ff] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="text-[13px] text-[#1d2129]">导入 PPT</p>
                        </div>
                    </button>
                    <button class="w-full flex items-center px-3 py-2.5 hover:bg-[#f5f6f8] rounded transition-colors group">
                        <div class="text-[#a0a8b4] mr-2.5 group-hover:text-[#3370ff] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </div>
                        <div class="flex-1 text-left">
                            <p class="text-[13px] text-[#1d2129]">语音与交互</p>
                        </div>
                    </button>
                </div>

                <div class="card p-4">
                    <h3 class="text-[12px] font-medium text-[#6b7785] mb-3">本周学情简报</h3>
                    <div class="space-y-3">
                        <div class="flex justify-between items-baseline">
                            <div>
                                <p class="text-[20px] font-semibold text-[#1d2129] leading-none mb-1">856</p>
                                <p class="text-[12px] text-[#6b7785]">参与学习人次</p>
                            </div>
                            <div class="text-[#34c759] text-[12px] font-medium">
                                +12%
                            </div>
                        </div>
                        <div class="h-px w-full bg-[#ebedf0]"></div>
                        <div class="flex justify-between items-baseline">
                            <div>
                                <p class="text-[20px] font-semibold text-[#1d2129] leading-none mb-1">1,204</p>
                                <p class="text-[12px] text-[#6b7785]">AI 助教答疑</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
