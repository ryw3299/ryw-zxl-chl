<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超星互动智课 - 全新视觉探索</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,500,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Satoshi', 'system-ui', 'sans-serif'],
                        heading: ['Cabinet Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f4f6f5',
                            100: '#e5ebe8',
                            400: '#8ba69c',
                            500: '#648779',
                            800: '#2d3d37',
                            900: '#1b2622',
                        },
                        surface: '#ffffff',
                        background: '#fafafa',
                    },
                    boxShadow: {
                        'premium': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 0 3px rgba(0,0,0,0.02)',
                        'floating': '0 12px 32px -4px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0,0,0,0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #f7f7f8;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .bento-card {
            background: #ffffff;
            border: 1px solid rgba(0,0,0,0.04);
            border-radius: 24px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .bento-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.06);
        }
        /* 隐藏滚动条 */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-900 min-h-screen font-sans selection:bg-brand-100 selection:text-brand-900 antialiased">

    <!-- 顶部悬浮导航 -->
    <nav class="glass-nav fixed top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer">
            <div class="w-10 h-10 bg-brand-900 rounded-2xl flex items-center justify-center rotate-3 hover:rotate-0 transition-transform duration-300">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <span class="font-heading font-bold text-2xl tracking-tight text-brand-900">超星智课</span>
        </div>
        
        <div class="hidden md:flex items-center space-x-1 bg-gray-100/50 p-1 rounded-full border border-gray-200/60">
            <a href="#" class="px-5 py-2 bg-white rounded-full text-sm font-semibold shadow-sm text-brand-900">工作台</a>
            <a href="#" class="px-5 py-2 rounded-full text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-100/80 transition-colors">知识库</a>
            <a href="#" class="px-5 py-2 rounded-full text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-100/80 transition-colors">数据分析</a>
        </div>

        <div class="flex items-center gap-4">
            <button class="w-10 h-10 rounded-full bg-white border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition-colors relative">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                <span class="absolute top-2 right-2.5 w-2 h-2 bg-rose-500 rounded-full"></span>
            </button>
            <div class="w-10 h-10 rounded-full bg-brand-100 border border-brand-200 overflow-hidden cursor-pointer">
                <img src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix&backgroundColor=e5ebe8" alt="User">
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <main class="max-w-7xl mx-auto pt-32 pb-20 px-6">
        
        <!-- 头部 Banner: 告别传统的方块，使用大排版和精致插画感 -->
        <div class="flex flex-col md:flex-row items-end justify-between mb-12 gap-6">
            <div>
                <p class="text-brand-500 font-medium tracking-wide text-sm mb-3 uppercase">Sun, Jun 7</p>
                <h1 class="font-heading font-bold text-5xl md:text-6xl text-brand-900 leading-tight">
                    下午好，王老师。<br/>
                    <span class="text-gray-400 font-medium text-4xl">准备好开启新一课了吗？</span>
                </h1>
            </div>
            <button class="group flex items-center gap-3 bg-brand-900 text-white px-8 py-4 rounded-full font-medium text-lg hover:bg-brand-800 hover:shadow-floating transition-all">
                <svg class="w-5 h-5 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                创作新课件
            </button>
        </div>

        <!-- Bento Grid 布局 -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            <!-- 大模块：进行中的课程 -->
            <div class="bento-card col-span-1 md:col-span-8 p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-64 h-64 bg-brand-50 rounded-full blur-3xl -mr-20 -mt-20 opacity-50"></div>
                <div class="relative z-10 flex justify-between items-center mb-8">
                    <h2 class="font-heading font-bold text-2xl text-brand-900">最近编辑</h2>
                    <a href="#" class="text-sm font-medium text-brand-500 hover:text-brand-800 flex items-center gap-1">全部课程 <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></a>
                </div>
                
                <div class="flex gap-6 overflow-x-auto pb-4 snap-x">
                    <!-- 课程卡片 1 -->
                    <div class="min-w-[280px] bg-gray-50/50 rounded-2xl p-5 border border-gray-100 hover:bg-white hover:shadow-premium transition-all snap-start cursor-pointer">
                        <div class="w-12 h-12 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center mb-4">
                            <span class="text-2xl">⚛️</span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-900 mb-1">高中物理：量子力学初步</h3>
                        <p class="text-sm text-gray-500 mb-4 line-clamp-1">包含 24 页交互幻灯片及 3 个随堂测试</p>
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mb-2">
                            <div class="bg-brand-500 h-1.5 rounded-full" style="width: 85%"></div>
                        </div>
                        <p class="text-xs text-gray-400 text-right">完成度 85%</p>
                    </div>

                    <!-- 课程卡片 2 -->
                    <div class="min-w-[280px] bg-gray-50/50 rounded-2xl p-5 border border-gray-100 hover:bg-white hover:shadow-premium transition-all snap-start cursor-pointer">
                        <div class="w-12 h-12 bg-white rounded-xl shadow-sm border border-gray-100 flex items-center justify-center mb-4">
                            <span class="text-2xl">📜</span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-900 mb-1">唐诗宋词鉴赏</h3>
                        <p class="text-sm text-gray-500 mb-4 line-clamp-1">正在生成 AI 语音讲解...</p>
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mb-2">
                            <div class="bg-amber-400 h-1.5 rounded-full animate-pulse" style="width: 40%"></div>
                        </div>
                        <p class="text-xs text-gray-400 text-right">生成中 40%</p>
                    </div>
                </div>
            </div>

            <!-- 数据统计小卡片组合 -->
            <div class="col-span-1 md:col-span-4 grid grid-rows-2 gap-6">
                <!-- 统计 1 -->
                <div class="bento-card p-6 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-2">
                        <span class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg></span>
                        <span class="text-xs font-bold text-green-500 bg-green-50 px-2 py-1 rounded-md">+12%</span>
                    </div>
                    <p class="text-sm font-medium text-gray-500">本周参与互动人次</p>
                    <p class="font-heading font-bold text-4xl text-gray-900 mt-1">1,284</p>
                </div>
                <!-- 统计 2 -->
                <div class="bento-card p-6 flex flex-col justify-center bg-brand-900 text-white">
                    <div class="flex items-center justify-between mb-2">
                        <span class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg></span>
                    </div>
                    <p class="text-sm font-medium text-white/70">AI 助教答疑次数</p>
                    <p class="font-heading font-bold text-4xl text-white mt-1">356</p>
                </div>
            </div>

            <!-- 工具箱 / 快捷操作 -->
            <div class="bento-card col-span-1 md:col-span-12 p-8">
                <h2 class="font-heading font-bold text-2xl text-brand-900 mb-6">核心工具</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="group border border-gray-100 rounded-2xl p-6 hover:border-brand-200 hover:bg-brand-50/50 cursor-pointer transition-colors">
                        <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:bg-white group-hover:shadow-sm transition-all">
                            <svg class="w-6 h-6 text-brand-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">导入 PPT / PDF</h3>
                        <p class="text-xs text-gray-500">一键解析排版</p>
                    </div>
                    <div class="group border border-gray-100 rounded-2xl p-6 hover:border-brand-200 hover:bg-brand-50/50 cursor-pointer transition-colors">
                        <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:bg-white group-hover:shadow-sm transition-all">
                            <svg class="w-6 h-6 text-brand-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">设计互动环节</h3>
                        <p class="text-xs text-gray-500">插入游戏与问答</p>
                    </div>
                    <div class="group border border-gray-100 rounded-2xl p-6 hover:border-brand-200 hover:bg-brand-50/50 cursor-pointer transition-colors">
                        <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:bg-white group-hover:shadow-sm transition-all">
                            <svg class="w-6 h-6 text-brand-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">录制语音画外音</h3>
                        <p class="text-xs text-gray-500">真人或 AI 播报</p>
                    </div>
                    <div class="group border border-gray-100 rounded-2xl p-6 hover:border-brand-200 hover:bg-brand-50/50 cursor-pointer transition-colors">
                        <div class="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:bg-white group-hover:shadow-sm transition-all">
                            <svg class="w-6 h-6 text-brand-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        </div>
                        <h3 class="font-bold text-gray-900 mb-1">学生学情分析</h3>
                        <p class="text-xs text-gray-500">掌握度与图谱</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
