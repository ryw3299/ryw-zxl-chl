<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>超星互动智课 - 新版设计预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryHover: '#1d4ed8',
                        surface: '#ffffff',
                        background: '#f8fafc',
                        border: '#e2e8f0',
                        textMain: '#0f172a',
                        textMuted: '#64748b'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-background text-textMain min-h-screen flex">
    <aside class="w-64 bg-surface border-r border-border flex flex-col fixed h-full z-10">
        <div class="p-6 flex items-center space-x-3">
            <div class="w-8 h-8 rounded bg-primary text-white flex items-center justify-center font-bold text-xl">
                <i class="fas fa-book-open text-sm"></i>
            </div>
            <span class="text-xl font-bold tracking-tight text-gray-900">互动智课</span>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto no-scrollbar">
            <a href="#" class="flex items-center px-3 py-2.5 bg-blue-50 text-primary rounded-lg font-medium">
                <i class="fas fa-home w-5 text-center mr-3"></i>工作台
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-textMuted hover:bg-gray-50 hover:text-textMain rounded-lg transition-colors font-medium">
                <i class="fas fa-cloud-upload-alt w-5 text-center mr-3"></i>课件上传制作
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-textMuted hover:bg-gray-50 hover:text-textMain rounded-lg transition-colors font-medium">
                <i class="fas fa-folder-open w-5 text-center mr-3"></i>资源知识库
            </a>
            <div class="pt-6 pb-2 px-3 text-xs font-semibold text-gray-400 uppercase tracking-wider">互动体验</div>
            <a href="#" class="flex items-center px-3 py-2.5 text-textMuted hover:bg-gray-50 hover:text-textMain rounded-lg transition-colors font-medium">
                <i class="fas fa-play-circle w-5 text-center mr-3"></i>课程播放器
            </a>
            <a href="#" class="flex items-center px-3 py-2.5 text-textMuted hover:bg-gray-50 hover:text-textMain rounded-lg transition-colors font-medium">
                <i class="fas fa-robot w-5 text-center mr-3"></i>AI 助教答疑
            </a>
        </nav>
        <div class="p-4 border-t border-border">
            <div class="flex items-center space-x-3 px-3 py-2 rounded-lg hover:bg-gray-50 cursor-pointer transition-colors">
                <img src="https://ui-avatars.com/api/?name=User" class="w-9 h-9 rounded-full">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate">王老师</p>
                </div>
            </div>
        </div>
    </aside>
    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        <header class="h-16 bg-surface border-b border-border flex items-center justify-between px-8 sticky top-0 z-10">
            <h1 class="text-xl font-semibold text-gray-800">工作台</h1>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input type="text" placeholder="搜索..." class="pl-9 pr-4 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary w-64">
                </div>
                <button class="relative p-2 text-gray-500 hover:text-gray-700"><i class="far fa-bell text-lg"></i></button>
            </div>
        </header>
        <div class="p-8 flex-1 overflow-auto">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white mb-8 shadow-sm flex items-center justify-between">
                <div>
                    <h2 class="text-2xl font-bold mb-2">上午好，王老师！</h2>
                    <p class="text-blue-100 mb-6">您本周已完成 3 份智能课件的制作，累计覆盖 120 名学生。</p>
                    <button class="bg-white text-blue-600 px-5 py-2.5 rounded-lg font-medium shadow-sm"><i class="fas fa-plus mr-2"></i>新建智能课件</button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-surface rounded-xl p-6 border border-border shadow-sm flex items-center justify-between">
                    <div><p class="text-sm font-medium text-textMuted mb-1">总课件数</p><p class="text-2xl font-bold text-gray-900">24</p></div>
                    <div class="w-12 h-12 bg-blue-50 rounded-full flex items-center justify-center text-primary"><i class="fas fa-file-alt text-xl"></i></div>
                </div>
                <div class="bg-surface rounded-xl p-6 border border-border shadow-sm flex items-center justify-between">
                    <div><p class="text-sm font-medium text-textMuted mb-1">本周学习人次</p><p class="text-2xl font-bold text-gray-900">856</p></div>
                    <div class="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center text-green-600"><i class="fas fa-users text-xl"></i></div>
                </div>
                <div class="bg-surface rounded-xl p-6 border border-border shadow-sm flex items-center justify-between">
                    <div><p class="text-sm font-medium text-textMuted mb-1">平均互动率</p><p class="text-2xl font-bold text-gray-900">78%</p></div>
                    <div class="w-12 h-12 bg-purple-50 rounded-full flex items-center justify-center text-purple-600"><i class="fas fa-mouse-pointer text-xl"></i></div>
                </div>
                <div class="bg-surface rounded-xl p-6 border border-border shadow-sm flex items-center justify-between">
                    <div><p class="text-sm font-medium text-textMuted mb-1">AI答疑次数</p><p class="text-2xl font-bold text-gray-900">1,204</p></div>
                    <div class="w-12 h-12 bg-orange-50 rounded-full flex items-center justify-center text-orange-600"><i class="fas fa-comments text-xl"></i></div>
                </div>
            </div>
            <div class="bg-surface rounded-xl border border-border shadow-sm overflow-hidden mb-8">
                <div class="px-6 py-5 border-b border-border bg-gray-50/50"><h3 class="font-semibold text-gray-800">快捷操作</h3></div>
                <div class="p-6 grid grid-cols-4 gap-4">
                    <button class="flex flex-col items-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-primary rounded-xl transition-all"><i class="fas fa-upload text-xl mb-2 text-gray-400"></i><span class="text-sm font-medium">上传 PPT</span></button>
                    <button class="flex flex-col items-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-primary rounded-xl transition-all"><i class="fas fa-magic text-xl mb-2 text-gray-400"></i><span class="text-sm font-medium">智能生成</span></button>
                    <button class="flex flex-col items-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-primary rounded-xl transition-all"><i class="fas fa-gamepad text-xl mb-2 text-gray-400"></i><span class="text-sm font-medium">互动设计</span></button>
                    <button class="flex flex-col items-center p-4 bg-gray-50 hover:bg-blue-50 hover:text-primary rounded-xl transition-all"><i class="fas fa-book-reader text-xl mb-2 text-gray-400"></i><span class="text-sm font-medium">浏览题库</span></button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
