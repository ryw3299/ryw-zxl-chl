# ChaoXingAgent — pyproject.toml
#
# This is the canonical build / dependency manifest.  Everything that uv,
# pip, and tox need is declared here.  ``requirements.txt`` is kept only
# as a frozen-output convenience; ``uv.lock`` is the source of truth.
#
# Common workflows:
#   uv sync                       # install all deps incl. dev / e2e extras
#   uv sync --no-dev              # production install (smaller footprint)
#   uv sync --extra claude        # add the optional Claude SDK
#   uv lock                       # refresh uv.lock after editing this file
#   uv run pytest                 # run tests in the managed venv
#   uv run uvicorn src.api.app:app --reload
#
# Re-export to plain pip (for CI systems that don't have uv yet):
#   uv export --no-hashes --format requirements-txt > requirements.txt

[project]
name            = "chaoxing-agent"
version         = "0.1.0"
description     = "AI 互动智课生成与实时问答系统"
readme          = "README.md"
requires-python = ">=3.13,<3.14"
license         = { text = "Proprietary" }

dependencies = [
    # ── core web stack ─────────────────────────────────────────
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.18",
    "PyYAML>=6,<7",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",

    # ── persistence ────────────────────────────────────────────
    "sqlalchemy>=2,<3",
    "pymysql>=1,<2",
    "cryptography>=43,<46",   # required by pymysql for caching_sha2_password

    # ── document parsing ───────────────────────────────────────
    "PyMuPDF>=1.27,<2",
    "python-pptx>=1.0,<2",
    "python-docx>=1.2,<2",

    # ── RAG ────────────────────────────────────────────────────
    "numpy>=1.24",
    "faiss-cpu>=1.8",
    "jieba>=0.42",
    "rank-bm25>=0.2",
    "cachetools>=5",

    # ── voice (TTS) ────────────────────────────────────────────
    "edge-tts>=6,<8",

    # ── student agent (OpenHands path) ─────────────────────────
    "openhands>=0.4,<5",
]

[project.optional-dependencies]
# Claude Agent SDK (alternative student-agent backend).
# Install with:  uv sync --extra claude
claude = [
    "claude-agent-sdk>=0.1",
]

# uv "dependency groups" (PEP 735) — used for tooling-only deps that are
# not part of the published package's runtime contract.  Activated by
# default in development and excluded by ``uv sync --no-dev``.
[dependency-groups]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]
dev = [
    "ruff>=0.15,<1",
    "ipython>=9,<10",
    {include-group = "test"},
]

[tool.uv]
# Pin the Python interpreter that uv will manage / use.
# uv will download CPython 3.13 automatically if missing — no apt or
# deadsnakes PPA needed on the server.
managed         = true

# When `uv sync` runs it auto-installs the dev group unless overridden by
# `--no-dev` (production deploy).  Because dev includes the test group,
# both ruff/ipython AND pytest end up installed in dev installs.
default-groups  = ["dev"]

# uv resolution settings tuned for this project.
resolution      = "highest"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
