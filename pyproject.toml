# 智学工坊 — pyproject.toml

[project]
name            = "ai-study-platform"
version         = "0.1.0"
description     = "基于大模型的工科生个性化学习资源生成与多智能体学习辅助系统"
readme          = "README.md"
requires-python = ">=3.13,<3.14"
license         = { text = "Proprietary" }

dependencies = [
    # ── core web stack ─────────────────────────────────────────
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.18",
    "httpx>=0.27,<1",

    # ── persistence ────────────────────────────────────────────
    "sqlalchemy>=2,<3",
    "psycopg2-binary>=2.9",

    # ── auth ───────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3",

    # ── utilities ──────────────────────────────────────────────
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
]

[dependency-groups]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
]
dev = [
    "ruff>=0.15,<1",
    {include-group = "test"},
]

[tool.uv]
managed         = true
default-groups  = ["dev"]
resolution      = "highest"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"
