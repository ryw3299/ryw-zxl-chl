<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChaoXingAgent · API 测试面板</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #161a23;
      --panel-2: #1d2230;
      --line: #2a3142;
      --text: #e6e9f2;
      --muted: #8a93a8;
      --accent: #5b8cff;
      --accent-2: #6dd6c1;
      --warn: #ffba7a;
      --err: #ff7a8a;
      --ok: #76e3a8;
      --code-bg: #0c0e14;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    header .meta {
      color: var(--muted);
      font-size: 12px;
    }
    header input {
      flex: 0 0 320px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
    }
    header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
    }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: calc(100vh - 64px);
    }
    nav {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 0;
      overflow-y: auto;
    }
    nav .group {
      padding: 0 18px 6px;
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 18px;
    }
    nav .group:first-child { margin-top: 0; }
    nav button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--text);
      padding: 8px 18px;
      cursor: pointer;
      font-size: 13px;
      border-left: 3px solid transparent;
    }
    nav button:hover { background: var(--panel-2); }
    nav button.active {
      border-left-color: var(--accent);
      background: var(--panel-2);
      color: #fff;
    }
    nav button .method {
      display: inline-block;
      width: 42px;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      margin-right: 6px;
    }
    nav button .method.GET { color: var(--accent-2); }
    section.content {
      padding: 24px 28px;
      overflow-y: auto;
    }
    .endpoint-title {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 4px;
    }
    .endpoint-title .method {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
    }
    .endpoint-title .method.GET { background: var(--accent-2); color: #0c2118; }
    .endpoint-title h2 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }
    .endpoint-path {
      font-family: "SF Mono", "Monaco", monospace;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .desc {
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 13px;
    }
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--code-bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: "SF Mono", "Monaco", monospace;
      font-size: 12px;
    }
    textarea {
      min-height: 220px;
      resize: vertical;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .row label {
      flex: 0 0 110px;
      color: var(--muted);
      font-size: 12px;
    }
    .row input { flex: 1; }
    button.primary {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary:hover { filter: brightness(1.1); }
    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--line);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    .status {
      font-size: 12px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.err { color: var(--err); }
    pre.response {
      background: var(--code-bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      max-height: 500px;
      overflow: auto;
      font-family: "SF Mono", "Monaco", monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .upload-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    .id-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      padding: 8px 24px;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      align-items: center;
      min-height: 36px;
    }
    .id-bar .id-label {
      color: var(--muted);
      margin-right: 4px;
    }
    .id-bar .id-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--panel);
      border: 1px solid var(--line);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: "SF Mono", "Monaco", monospace;
      cursor: pointer;
      color: var(--text);
    }
    .id-bar .id-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .id-bar .id-chip strong {
      color: var(--accent-2);
      font-weight: 600;
    }
    .id-bar .clear-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .id-bar .empty-hint {
      color: var(--muted);
      font-style: italic;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--panel);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35);
      z-index: 100;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>

      // 平台对接
      {

        method: 'POST',
        path: '/api/v1/platform/syncUser',
        title: '同步外部用户',
        body: {
          platformId: 'plat001',
          userInfo: {
            userId: 'plat_stu001',
            userName: '李四',
            role: 'student',
            schoolId: 'sch10001',
            relatedCourseIds: ['plat_cou001'],
            contactInfo: { phone: '13800138000', email: 'lisi@xxx.com' },

      // 知识库（内部）
      {
        id: 'kb_create',
        group: '知识库（内部）',
        method: 'POST',
        path: '/internal/kb/create',
        title: '创建知识库',
        body: { courseId: 'cou001', kbName: '材料力学知识库', indexBackend: 'faiss' },
      },
      {
        id: 'kb_addSources',
        group: '知识库（内部）',
        method: 'POST',
        path: '/internal/kb/addSources',
        title: '挂载来源 lesson',
        body: { kbId: '', lessonIds: [] },
      },
      {
        id: 'kb_build',
        group: '知识库（内部）',
        method: 'POST',
        path: '/internal/kb/build',
        title: '构建索引',
        body: { kbId: '', lessonIds: [] },
      },
      {
        id: 'kb_status',
        group: '知识库（内部）',
        method: 'GET',
        path: '/internal/kb/status/{kbId}',
        title: '查询知识库状态',
        pathParams: { kbId: '' },
      },
      {
        id: 'kb_list',
        group: '知识库（内部）',
        method: 'GET',
        path: '/internal/kb/list',
        title: '列出全部知识库',
      },
    ];

    const STORAGE_KEY = 'chaoxing_panel_state_v1';
    const ID_KEYS = [
      'parseId', 'scriptId', 'audioId', 'lessonId',
      'sessionId', 'answerId', 'trackId', 'adjustId',
      'kbId', 'kbSourceId', 'internalCourseId', 'internalUserId',
    ];

    // ----- ui -----
    const navEl = document.getElementById('nav');
    const contentEl = document.getElementById('content');
    const baseUrlInput = document.getElementById('baseUrl');
    const idBarEl = document.getElementById('idBar');

    let state = loadState();
    let currentId = ENDPOINTS[0].id;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          parsed.idPool = parsed.idPool || {};
          return parsed;
        }
      } catch (_) {}
      return { byId: {}, baseUrl: '', idPool: {} };
    }
    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    // ----- ID pool: automatically collect parseId/scriptId/... from responses -----
    function collectIdsFromResponse(text) {
      let payload;
      try { payload = JSON.parse(text); } catch (_) { return; }
      const found = {};
      const walk = (node) => {
        if (!node) return;
        if (Array.isArray(node)) { node.forEach(walk); return; }
        if (typeof node === 'object') {
          for (const [k, v] of Object.entries(node)) {
            if (ID_KEYS.includes(k) && typeof v === 'string' && v) {
              found[k] = v;
            }
            walk(v);
          }
        }
      };
      walk(payload);
      let changed = false;
      for (const [k, v] of Object.entries(found)) {
        if (state.idPool[k] !== v) {
          state.idPool[k] = v;
          changed = true;
        }
      }
      if (changed) {
        saveState();
        renderIdBar();
      }
    }

    function renderIdBar() {
      const entries = Object.entries(state.idPool || {}).filter(([_, v]) => v);
      if (!entries.length) {
        idBarEl.innerHTML = '<span class="empty-hint">暂无 ID（任何接口返回的 parseId/scriptId/lessonId 等会自动出现在这里，点击即可回填）</span>';
        return;
      }
      idBarEl.innerHTML = '<span class="id-label">最近 ID（点击回填）：</span>'
        + entries.map(([k, v]) =>
            `<span class="id-chip" data-k="${k}" data-v="${v}" title="点击把 ${k} 写入当前请求"><strong>${k}</strong>=${v}</span>`
          ).join('')
        + '<button class="clear-btn" id="clearIdsBtn">清空 ID</button>';
      idBarEl.querySelectorAll('.id-chip').forEach((chip) => {
        chip.addEventListener('click', () => fillIdIntoCurrent(chip.dataset.k, chip.dataset.v));
      });
      idBarEl.querySelector('#clearIdsBtn').addEventListener('click', () => {
        state.idPool = {};
        saveState();
        renderIdBar();
      });
    }

    function fillIdIntoCurrent(key, value) {
      const ep = ENDPOINTS.find((e) => e.id === currentId);
      if (!ep) return;
      const s = getStateFor(ep.id, ep);
      let touched = false;

      // path params
      if (ep.pathParams && key in (s.pathParams || {})) {
        s.pathParams[key] = value;
        touched = true;
      }
      // query params
      if (ep.query && key in (s.query || {})) {
        s.query[key] = value;
        touched = true;
      }
      // form fields
      if (ep.formFields) {
        for (const ff of s.formFields) {
          if (ff.name === key && ff.type !== 'file') {
            ff.value = value;
            touched = true;
          }
        }
      }
      // json body
      if (ep.body !== undefined && typeof s.body === 'string') {
        try {
          const obj = JSON.parse(s.body || '{}');
          if (key in obj || _hasKeyDeep(ep.body, key)) {
            obj[key] = value;
            s.body = JSON.stringify(obj, null, 2);
            touched = true;
          }
        } catch (_) {
          // body not valid JSON; do nothing
        }
      }

      if (touched) {
        setStateFor(ep.id, s);
        renderEndpoint();
        showToast(`已把 ${key} 填入当前请求`);
      } else {
        showToast(`当前接口不接受 ${key}`);
      }
    }

    function _hasKeyDeep(obj, key) {
      if (!obj || typeof obj !== 'object') return false;
      if (Array.isArray(obj)) return obj.some((v) => _hasKeyDeep(v, key));
      if (key in obj) return true;
      return Object.values(obj).some((v) => _hasKeyDeep(v, key));
    }

    let _toastTimer = null;
    function showToast(text) {
      let el = document.getElementById('toast');
      if (!el) {
        el = document.createElement('div');
        el.id = 'toast';
        el.className = 'toast';
        document.body.appendChild(el);
      }
      el.textContent = text;
      el.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    baseUrlInput.value = state.baseUrl || '';
    baseUrlInput.addEventListener('change', () => {
      state.baseUrl = baseUrlInput.value.trim();
      saveState();
    });

    function buildNav() {
      const groups = {};
      for (const ep of ENDPOINTS) {
        (groups[ep.group] ||= []).push(ep);
      }
      navEl.innerHTML = '';
      for (const [group, items] of Object.entries(groups)) {
        const head = document.createElement('div');
        head.className = 'group';
        head.textContent = group;
        navEl.appendChild(head);
        for (const ep of items) {
          const btn = document.createElement('button');
          btn.dataset.id = ep.id;
          btn.innerHTML = `<span class="method ${ep.method}">${ep.method}</span> ${ep.title}`;
          btn.addEventListener('click', () => selectEndpoint(ep.id));
          navEl.appendChild(btn);
        }
      }
      highlightNav();
    }

    function highlightNav() {
      navEl.querySelectorAll('button').forEach((b) => {
        b.classList.toggle('active', b.dataset.id === currentId);
      });
    }

    function getStateFor(id, ep) {
      const s = state.byId[id] || {};
      return {
        body: s.body !== undefined ? s.body : (ep.body !== undefined ? JSON.stringify(ep.body, null, 2) : ''),
        query: s.query !== undefined ? s.query : (ep.query ? { ...ep.query } : null),
        pathParams: s.pathParams !== undefined ? s.pathParams : (ep.pathParams ? { ...ep.pathParams } : null),
        formFields: s.formFields !== undefined ? s.formFields : (ep.formFields ? ep.formFields.map((f) => ({ ...f })) : null),
        response: s.response,
        status: s.status,
      };
    }

    function setStateFor(id, partial) {
      state.byId[id] = { ...(state.byId[id] || {}), ...partial };
      saveState();
    }

    function renderEndpoint() {
      const ep = ENDPOINTS.find((e) => e.id === currentId);
      const s = getStateFor(ep.id, ep);

      contentEl.innerHTML = '';

      const header = document.createElement('div');
      header.innerHTML = `
        <div class="endpoint-title">
          <span class="method ${ep.method}">${ep.method}</span>
          <h2>${ep.title}</h2>
        </div>
        <div class="endpoint-path">${ep.path}</div>
        ${ep.desc ? `<div class="desc">${ep.desc}</div>` : ''}
      `;
      contentEl.appendChild(header);

      const cols = document.createElement('div');
      cols.className = 'columns';

      // ---- request card ----
      const reqCard = document.createElement('div');
      reqCard.className = 'card';
      reqCard.innerHTML = `<h3>请求</h3>`;

      // path params
      if (ep.pathParams) {
        for (const [k, v] of Object.entries(s.pathParams || {})) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<label>{${k}}</label><input data-pk="${k}" value="${v ?? ''}" />`;
          row.querySelector('input').addEventListener('input', (e) => {
            s.pathParams[k] = e.target.value;
            setStateFor(ep.id, { pathParams: s.pathParams });
          });
          reqCard.appendChild(row);
        }
      }

      // query params
      if (ep.query) {
        for (const [k, v] of Object.entries(s.query || {})) {
          const row = document.createElement('div');
          row.className = 'row';
          row.innerHTML = `<label>?${k}</label><input data-qk="${k}" value="${v ?? ''}" />`;
          row.querySelector('input').addEventListener('input', (e) => {
            s.query[k] = e.target.value;
            setStateFor(ep.id, { query: s.query });
          });
          reqCard.appendChild(row);
        }
      }

      // multipart form fields
      if (ep.formFields) {
        for (const ff of s.formFields) {
          const row = document.createElement('div');
          row.className = 'row';
          if (ff.type === 'file') {
            row.innerHTML = `<label>${ff.name}</label><input type="file" data-form-file="${ff.name}" />`;
          } else {
            row.innerHTML = `<label>${ff.name}</label><input type="text" data-form-name="${ff.name}" value="${ff.value ?? ''}" />`;
            row.querySelector('input').addEventListener('input', (e) => {
              ff.value = e.target.value;
              setStateFor(ep.id, { formFields: s.formFields });
            });
          }
          reqCard.appendChild(row);
        }
        const hint = document.createElement('div');
        hint.className = 'upload-hint';
        hint.textContent = '提示：file 字段会以二进制 multipart 上传，其他字段作为表单字段。';
        reqCard.appendChild(hint);
      }

      // json body
      if (ep.body !== undefined) {
        const ta = document.createElement('textarea');
        ta.value = s.body;
        ta.addEventListener('input', () => {
          setStateFor(ep.id, { body: ta.value });
        });
        reqCard.appendChild(ta);
      }

      const actions = document.createElement('div');
      actions.className = 'actions';
      const sendBtn = document.createElement('button');
      sendBtn.className = 'primary';
      sendBtn.textContent = '发送请求';
      const resetBtn = document.createElement('button');
      resetBtn.className = 'secondary';
      resetBtn.textContent = '重置默认';
      const statusEl = document.createElement('div');
      statusEl.className = 'status';
      statusEl.textContent = s.status || '';
      actions.append(sendBtn, resetBtn, statusEl);
      reqCard.appendChild(actions);
      cols.appendChild(reqCard);

      // ---- response card ----
      const respCard = document.createElement('div');
      respCard.className = 'card';
      respCard.innerHTML = `<h3>响应</h3>`;
      const pre = document.createElement('pre');
      pre.className = 'response';
      pre.textContent = s.response || '(尚未发起请求)';
      respCard.appendChild(pre);
      cols.appendChild(respCard);

      contentEl.appendChild(cols);

      sendBtn.addEventListener('click', async () => {
        sendBtn.disabled = true;
        statusEl.className = 'status';
        statusEl.textContent = '请求中…';
        try {
          const result = await sendRequest(ep, s, reqCard);
          pre.textContent = result.text;
          statusEl.className = 'status ' + (result.ok ? 'ok' : 'err');
          statusEl.textContent = `HTTP ${result.status} · ${result.elapsedMs}ms`;
          setStateFor(ep.id, { response: result.text, status: statusEl.textContent });
          if (result.ok) collectIdsFromResponse(result.text);
        } catch (err) {
          pre.textContent = String(err && err.stack || err);
          statusEl.className = 'status err';
          statusEl.textContent = '请求失败';
          setStateFor(ep.id, { response: pre.textContent, status: statusEl.textContent });
        } finally {
          sendBtn.disabled = false;
        }
      });

      resetBtn.addEventListener('click', () => {
        delete state.byId[ep.id];
        saveState();
        renderEndpoint();
      });
    }

    async function sendRequest(ep, s, reqCard) {
      const base = (state.baseUrl || '').replace(/\/+$/, '') || '';
      let url = base + ep.path;

      // path params
      if (ep.pathParams) {
        for (const [k, v] of Object.entries(s.pathParams || {})) {
          url = url.replace(`{${k}}`, encodeURIComponent(v ?? ''));
        }
      }

      // query
      if (ep.query) {
        const params = new URLSearchParams();
        for (const [k, v] of Object.entries(s.query || {})) {
          if (v !== '' && v != null) params.append(k, v);
        }
        const qs = params.toString();
        if (qs) url += '?' + qs;
      }

      const init = { method: ep.method, headers: {} };

      if (ep.formFields) {
        const fd = new FormData();
        for (const ff of s.formFields) {
          if (ff.type === 'file') {
            const fileEl = reqCard.querySelector(`input[data-form-file="${ff.name}"]`);
            if (fileEl && fileEl.files && fileEl.files[0]) {
              fd.append(ff.name, fileEl.files[0]);
            }
          } else if (ff.value !== undefined && ff.value !== '') {
            fd.append(ff.name, ff.value);
          }
        }
        init.body = fd;
      } else if (ep.body !== undefined) {
        init.headers['Content-Type'] = 'application/json';
        if ((s.body || '').trim().length) {
          init.body = s.body;
        }
      }

      const t0 = performance.now();
      const resp = await fetch(url, init);
      const elapsedMs = Math.round(performance.now() - t0);
      const ct = resp.headers.get('content-type') || '';
      let text;
      if (ct.includes('application/json')) {
        text = JSON.stringify(await resp.json(), null, 2);
      } else {
        text = await resp.text();
      }
      return { ok: resp.ok, status: resp.status, elapsedMs, text };
    }

    function selectEndpoint(id) {
      currentId = id;
      highlightNav();
      renderEndpoint();
    }

    buildNav();
    renderEndpoint();
    renderIdBar();
  </script>
</body>
</html>
