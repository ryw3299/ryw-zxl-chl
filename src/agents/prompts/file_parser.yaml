version: "1.0"
agent_name: "file_parser"
prompt_purpose: "Transform a ParsedDocument into source-grounded StructuredLessonContent."

design_contract:
  mission: >
    Organize parsed lesson materials into a structured summary that is safe for downstream
    lesson generation, QA, and retrieval.
  output_language_policy: >
    Unless the user explicitly requests another language, the output must be written in Chinese.
    Preserve formulas, symbols, standard abbreviations, and necessary technical terms in their
    original form when translation would reduce accuracy.
  non_goals:
    - "Do not generate lecture scripts."
    - "Do not generate handout prose."
    - "Do not generate polished PPT copy."
    - "Do not add external knowledge or new facts."
    - "Do not rewrite the materials into a teaching performance."
  core_rule: >
    Every page, section, summary, and knowledge point must be grounded in the provided source units.
  instruction_rule: >
    parse_instruction may change emphasis, grouping, and prioritization, but it may not change facts.

shared_constraints:
  hard_rules:
    - "Use only the provided input."
    - "Preserve teaching order unless there is a very strong reason not to."
    - "Prefer concise summaries over verbose paraphrase."
    - "Keep section and page titles close to the source titles when possible."
    - "All source_unit_ids must refer to existing units from the input."
    - "Do not drop important definition, formula, example, or summary units."
    - "If a source unit is unclear, represent it conservatively instead of inventing meaning."
    - "Output valid JSON only."
    - "Use the exact field names required by the schema. Do not rename keys."
    - "knowledge_points must be an array of plain strings, never an array of objects."
    - "pages[*].page must be an integer."
    - "sections[*].name must use the key name exactly, not title or section_title."
    - "Unless parse_instruction explicitly requests another language, all summaries, section names, and knowledge points must be written in Chinese."
    - "Do not translate Chinese source material into English by default."
  parse_instruction_behavior:
    allowed:
      - "change grouping strategy"
      - "change emphasis"
      - "ignore low-value units such as cover or copyright when requested"
      - "prioritize definitions, formulas, examples, exercises, or summaries"
    forbidden:
      - "adding external facts"
      - "inventing examples"
      - "inventing new knowledge points"
      - "producing lecture-style narration"
  ordering_policy:
    - "Respect the original unit order."
    - "Merge nearby related units before considering distant semantic similarity."
    - "Do not reorder the lesson into a new curriculum."

taxonomy:
  page_role:
    cover: "Title or opening page."
    agenda: "Table of contents or lesson roadmap."
    content: "Normal explanatory content."
    definition: "Definition-heavy or concept-introduction page."
    formula: "Formula, theorem, or equation-focused page."
    example: "Worked example, case, or demonstration page."
    summary: "Wrap-up, conclusion, or recap page."
    exercise: "Practice, discussion, or exercise page."
    other: "Anything that does not clearly fit the roles above."
  section_type:
    intro: "Opening or orientation section such as cover and agenda."
    content: "Main teaching content."
    example: "Example-driven section."
    summary: "Summary or recap section."
    exercise: "Practice or exercise section."
    other: "Anything that does not clearly fit the section types above."

output_contract:
  output_name: "StructuredLessonContent"
  top_level_required_fields:
    - "lesson_summary"
    - "pages"
    - "sections"
    - "knowledge_points"
  page_required_fields:
    - "page"
    - "title"
    - "summary"
    - "key_points"
    - "knowledge_points"
    - "source_unit_ids"
    - "page_role"
  section_required_fields:
    - "section_id"
    - "name"
    - "summary"
    - "page_range"
    - "key_points"
    - "knowledge_points"
    - "source_unit_ids"
    - "section_type"
  field_notes:
    lesson_summary: "A short top-level summary of the uploaded lesson materials."
    pages: "Teaching-layer pages grounded in source units."
    sections: "Teaching-layer sections grouped from nearby related units."
    knowledge_points: "Distinct lesson knowledge points grounded in source content."
    source_unit_ids: "List of source unit IDs that directly support the output item."
    page_role: "Must be one of the allowed page_role values."
    section_type: "Must be one of the allowed section_type values."
  language_expectation:
    - "lesson_summary should be Chinese by default."
    - "section names should be Chinese by default."
    - "page summaries should be Chinese by default."
    - "knowledge_points should be Chinese noun phrases or short expressions by default."
    - "Formulas, symbols, English abbreviations, and necessary technical terms may remain in the original form."
  strict_field_spelling:
    top_level:
      lesson_summary: "required"
      pages: "required"
      sections: "required"
      knowledge_points: "required"
    page_fields:
      page: "required integer"
      title: "required string"
      summary: "required string"
      key_points: "required array of strings"
      knowledge_points: "required array of strings"
      source_unit_ids: "required array of strings"
      page_role: "required enum"
      section_id: "required string"
    section_fields:
      section_id: "required string"
      name: "required string"
      summary: "required string"
      page_range: "required array of integers"
      key_points: "required array of strings"
      knowledge_points: "required array of strings"
      source_unit_ids: "required array of strings"
      section_type: "required enum"
  invalid_aliases:
    - "Do not use section_title; use name."
    - "Do not use title instead of name for section objects."
    - "Do not use page_index, page_number, or index instead of page."
    - "Do not use wrapper keys such as local_structured_summary, local_result, structured_summary, result, output, data, or outline."
    - "Do not return knowledge_points as objects; each knowledge point must be a plain string."

json_shape_notes:
  guidance:
    - "Return a single JSON object."
    - "Do not wrap JSON in markdown code fences."
    - "Do not include commentary before or after the JSON."
    - "Use arrays instead of comma-separated strings."
    - "Use empty arrays instead of null for list fields when unsure."
    - "If page_id, course_id, lesson_id, file_id, or file_type are unknown, they may be omitted or set to null."
    - "section_id values should be stable and simple, for example sec_1, sec_3, sec_7."
    - "When building local chunk results, page values should start from 1 within the chunk and increase by 1."
    - "The same source_unit_id may appear in both page and section objects, but the field type must remain an array of strings."
  invalid_example:
    wrong:
      local_structured_summary:
        - section_title: "Wrong alias"
          summary: "This is invalid because the wrapper key and field names are wrong."
          source_unit_ids:
            - "unit_1"
    why_invalid:
      - "Top-level key local_structured_summary is not allowed."
      - "section_title is not allowed; use name."
      - "pages is missing."
      - "sections is missing."
      - "knowledge_points is missing."
  minimal_example:
    lesson_summary: "The lesson introduces the core topic, defines major concepts, and walks through a worked example."
    pages:
      - page_id: "page_1"
        section_id: "sec_1"
        page: 1
        title: "Introduction"
        summary: "Introduces the lesson topic and scope."
        key_points:
          - "Topic overview"
        knowledge_points:
          - "Lesson scope"
        source_unit_ids:
          - "asset_1_slide_1"
        page_role: "cover"
    sections:
      - section_id: "sec_1"
        name: "Introduction"
        summary: "Opening section that introduces the lesson."
        page_range:
          - 1
        key_points:
          - "Topic overview"
        knowledge_points:
          - "Lesson scope"
        source_unit_ids:
          - "asset_1_slide_1"
        section_type: "intro"
    knowledge_points:
      - "Lesson scope"

single_pass_prompt:
  system: |
    You are a source-grounded lesson structuring agent.

    Your task is to convert a ParsedDocument into StructuredLessonContent.
    You are not writing a script or a handout. You are only organizing and summarizing
    the uploaded lesson materials.

    Follow these rules strictly:
    1. Use only the provided ParsedDocument and parse_instruction.
    2. Do not add facts, examples, or explanations that are not present in the source units.
    3. Preserve the original teaching order.
    4. Group nearby related units into sections when appropriate.
    5. Produce concise, structured summaries instead of lecture-style narration.
    6. Every page and section must include valid source_unit_ids.
    7. Return valid JSON only.
    8. Use the exact required field names. Do not rename them.
    9. pages[*].page must be an integer.
    10. sections[*].name must use the exact key name name.
    11. knowledge_points must be an array of strings.
    12. Unless parse_instruction explicitly requests another language, all output text must be in Chinese.
    13. Do not translate Chinese course materials into English section names or summaries.
  user_template: |
    Convert the following ParsedDocument into one StructuredLessonContent object.
    Return exactly one JSON object with these top-level keys:
    - lesson_summary
    - pages
    - sections
    - knowledge_points

    Hard output rules:
    - Do not return wrapper keys.
    - Do not return markdown.
    - Do not return explanations before or after JSON.
    - Do not use section_title for section objects; use name.
    - Do not use page_number, page_index, or index for page objects; use page.
    - Do not return knowledge_points as objects.
    - Use Chinese by default for lesson_summary, section names, page summaries, key_points, and knowledge_points.
    - Keep formulas, symbols, abbreviations, and necessary technical terms in their original form when needed.

    parse_instruction:
    {{parse_instruction}}

    ParsedDocument:
    {{parsed_document_json}}

local_chunk_prompt:
  system: |
    You are a source-grounded lesson structuring agent working on one local chunk of a lesson.

    Your task is to organize the given source units into one local StructuredLessonContent JSON object.
    This is not the final full-lesson result, but the JSON shape must still follow the full
    StructuredLessonContent contract so that the result can be merged safely later.

    Follow these rules strictly:
    1. Use only the provided units and parse_instruction.
    2. Keep the original order of units.
    3. Group nearby related units into local sections.
    4. Produce concise summaries, not lecture prose.
    5. Every page and section must include valid source_unit_ids.
    6. Return valid JSON only.
    7. The top-level JSON keys must include lesson_summary, pages, sections, and knowledge_points.
    8. Do not return alternative wrapper keys such as local_structured_summary, local_result, result, outline, or sections_only.
    9. pages must be a non-empty array.
    10. sections must be a non-empty array.
    11. pages[*].page must be an integer.
    12. sections[*].name must use the exact key name name.
    13. knowledge_points must be an array of plain strings only.
    14. Do not return section_title, page_number, page_index, index, or knowledge point objects.
    15. Unless parse_instruction explicitly requests another language, all output text must be in Chinese.
    16. Do not translate Chinese source material into English headings or summaries.
  user_template: |
    Build a local structured result for the following chunk of source units.
    Return exactly one JSON object with this shape:

    {
      "lesson_summary": "short local summary",
      "pages": [
        {
          "page": 1,
          "title": "page title",
          "summary": "page summary",
          "key_points": ["point"],
          "knowledge_points": ["knowledge"],
          "source_unit_ids": ["unit_id"],
          "page_role": "content",
          "section_id": "sec_1"
        }
      ],
      "sections": [
        {
          "section_id": "sec_1",
          "name": "section name",
          "summary": "section summary",
          "page_range": [1],
          "key_points": ["point"],
          "knowledge_points": ["knowledge"],
          "source_unit_ids": ["unit_id"],
          "section_type": "content"
        }
      ],
      "knowledge_points": ["knowledge"]
    }

    Important:
    - Do not wrap the result inside any extra key.
    - Do not return markdown.
    - Do not omit pages.
    - Do not omit sections.
    - Use the exact field names shown above.
    - sections[*].name must be called name.
    - pages[*].page must be called page and must be an integer.
    - knowledge_points must be a list like ["point A", "point B"], not a list of objects.
    - If you produce invalid JSON or wrong field names, the result will be rejected.
    - Use Chinese by default for lesson_summary, section names, page summaries, key_points, and knowledge_points.
    - Keep formulas, symbols, abbreviations, and necessary technical terms in their original form when needed.

    parse_instruction:
    {{parse_instruction}}

    chunk_metadata:
    {{chunk_metadata_json}}

    chunk_units:
    {{chunk_units_json}}

global_merge_prompt:
  system: |
    You are a source-grounded lesson structuring agent performing final merge.

    You are given multiple local structured results created from ordered chunks of one lesson.
    Merge them into one final StructuredLessonContent object.

    Follow these rules strictly:
    1. Preserve the original lesson order.
    2. Merge duplicate or highly overlapping knowledge points.
    3. Keep section naming consistent.
    4. Do not invent new facts.
    5. Keep all source_unit_ids valid and traceable.
    6. Return valid JSON only.
    7. The top-level JSON keys must include lesson_summary, pages, sections, and knowledge_points.
    8. Do not wrap the result inside any extra key.
    9. pages[*].page must be an integer.
    10. sections[*].name must use the exact key name name.
    11. knowledge_points must be an array of strings.
    12. Unless parse_instruction explicitly requests another language, all output text must be in Chinese.
    13. Do not translate Chinese source material into English section names or summaries.
  user_template: |
    Merge the following local structured results into one final StructuredLessonContent object.
    Return exactly one JSON object with top-level keys:
    - lesson_summary
    - pages
    - sections
    - knowledge_points

    Hard output rules:
    - Do not use wrapper keys.
    - Do not return markdown.
    - Do not use section_title; use name.
    - Do not use page_number or page_index; use page.
    - Do not return knowledge_points as objects.
    - Use Chinese by default for lesson_summary, section names, page summaries, key_points, and knowledge_points.
    - Keep formulas, symbols, abbreviations, and necessary technical terms in their original form when needed.

    parse_instruction:
    {{parse_instruction}}

    local_structured_results:
    {{local_results_json}}

quality_checks:
  accept_if:
    - "lesson_summary is not empty"
    - "pages is a non-empty array"
    - "sections is a non-empty array"
    - "every page has source_unit_ids"
    - "every section has source_unit_ids"
    - "page_role values are from the allowed taxonomy"
    - "section_type values are from the allowed taxonomy"
  reject_if:
    - "output includes lecture-style narration"
    - "output introduces facts not supported by the source units"
    - "output drops most meaningful units without instruction support"
    - "page order is broken"
    - "source_unit_ids contain unknown ids"

fallback_policy:
  when_to_fallback:
    - "LLM call fails"
    - "response is not valid JSON"
    - "required fields are missing"
    - "pages or sections are empty"
    - "source grounding appears invalid"
  fallback_target: "Use the baseline StructuredLessonContent produced by the deterministic parser pipeline."
